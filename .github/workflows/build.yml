name: Build Module
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Build C++
        run: |
          cd native
          mkdir -p build
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-30
          make -j$(nproc)

      - name: Prepare Final ZIP
        run: |
          mkdir -p template/zygisk
          cp native/build/super_hide_fix.so template/zygisk/arm64-v8a.so
          cd template
          zip -r ../StealthPID.zip *

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: StealthPID
          path: StealthPID.zip
